name: Deploy Application Forms

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          echo "Preparing public website..."

          cp -R public/. _site/

          if [ -d "data" ]; then
            echo "Copying data directory..."
            mkdir -p _site/data
            cp -R data/. _site/data/
          fi

          touch _site/.nojekyll

          echo "Website files:"
          find _site -maxdepth 3 -type f | sort

      - name: Verify index
        shell: bash
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "ERROR: _site/index.html was not found."
            exit 1
          fi

          echo "index.html found successfully."

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment files
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          cp -R public/. _site/

          if [ -d "data" ]; then
            mkdir -p _site/data
            cp -R data/. _site/data/
          fi

          touch _site/.nojekyll

      - name: Deploy gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Deploy Application Forms"
