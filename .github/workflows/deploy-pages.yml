name: Deploy Application Forms

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: application-forms-pages
  cancel-in-progress: true

jobs:

  build:
    name: Build Website
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare website
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          echo "Preparing Application Forms website..."

          cp -R public/. _site/

          if [ -d "data" ]; then
            echo "Copying data directory..."
            mkdir -p _site/data
            cp -R data/. _site/data/
          fi

          touch _site/.nojekyll

          echo "Deployment files:"
          find _site -maxdepth 3 -type f | sort

      - name: Verify website
        shell: bash
        run: |
          set -e

          if [ ! -f "_site/index.html" ]; then
            echo "ERROR: index.html is missing."
            exit 1
          fi

          if [ ! -f "_site/admin.html" ]; then
            echo "ERROR: admin.html is missing."
            exit 1
          fi

          echo "Website verification successful."

  deploy:
    name: Deploy Website
    runs-on: ubuntu-24.04
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare deployment
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          cp -R public/. _site/

          if [ -d "data" ]; then
            mkdir -p _site/data
            cp -R data/. _site/data/
          fi

          touch _site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Deploy Application Forms"
